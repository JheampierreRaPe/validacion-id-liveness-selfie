services:
  kyc-facial-service:
    build: .
    container_name: kyc-facial-service
    ports:
      - "8000:8000"
    environment:
      - API_KEY=${API_KEY:-changeme-super-secret-key}
      - FACE_MATCH_THRESHOLD=${FACE_MATCH_THRESHOLD:-0.68}
      - BLUR_LAPLACIAN_THRESHOLD=${BLUR_LAPLACIAN_THRESHOLD:-80.0}
    volumes:
      # Cachea los pesos de los modelos entre reinicios/rebuilds del contenedor
      - deepface_models:/app/.deepface
    restart: unless-stopped

volumes:
  deepface_models:
